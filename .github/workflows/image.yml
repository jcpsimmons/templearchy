name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build live ISO from flake (no KVM)
        run: nix build .#packages.aarch64-linux.iso -L --out-link result
      - name: Compress ISO
        run: |
          iso="$(find -L result -name '*.iso' -print -quit)"
          test -n "$iso"
          ls -lh "$iso"
          # -3 is fast enough for ARM CI. -19 blocked nightly for many minutes.
          zstd -T0 -3 -f "$iso" -o templearchy-aarch64.iso.zst
          ls -lh templearchy-aarch64.iso.zst
          bytes="$(wc -c < templearchy-aarch64.iso.zst)"
          if [ "$bytes" -gt 1900000000 ]; then
            echo "compressed ISO is $bytes bytes; GitHub release cap is 2GB" >&2
            exit 1
          fi
      - name: Keep the ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: templearchy-aarch64-iso
          path: templearchy-aarch64.iso.zst
          if-no-files-found: error
      - name: Publish nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: templearchy nightly
          files: templearchy-aarch64.iso.zst
          body: NixOS aarch64 live ISO (i3 + wezterm + nvim). Built from flake.nix without KVM. Password is temple.
          make_latest: true
