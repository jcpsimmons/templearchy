name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qcow:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build guest image from flake
        run: nix build .#packages.aarch64-linux.qcow2 -L --out-link result
      - name: Compress qcow2
        run: |
          qcow="$(find -L result -name '*.qcow2' -print -quit)"
          test -n "$qcow"
          zstd -T0 -19 -f "$qcow" -o templearchy-aarch64.qcow2.zst
          ls -lh templearchy-aarch64.qcow2.zst
      - name: Publish nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: templearchy nightly
          files: templearchy-aarch64.qcow2.zst
          body: NixOS aarch64 guest built from flake.nix on ubuntu-24.04-arm. Password is temple.
          make_latest: true
