name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build live ISO from flake (no KVM)
        run: nix build .#packages.aarch64-linux.iso -L --out-link result
      - name: Compress and split only if over GitHub's 2GiB file cap
        run: |
          iso="$(find -L result -name '*.iso' -print -quit)"
          test -n "$iso"
          ls -lh "$iso"
          zstd -T0 -3 -f "$iso" -o templearchy-aarch64.iso.zst
          ls -lh templearchy-aarch64.iso.zst
          bytes="$(wc -c < templearchy-aarch64.iso.zst)"
          # GitHub asset cap is 2147483648. 1.9G was too low: a 1.82GiB
          # zst still split, then the 1800M .00 part often failed to land.
          if [ "$bytes" -gt 2100000000 ]; then
            split -b 1600M -d -a 2 templearchy-aarch64.iso.zst templearchy-aarch64.iso.zst.
            rm -f templearchy-aarch64.iso.zst
            ls -lh templearchy-aarch64.iso.zst.*
            test -f templearchy-aarch64.iso.zst.00
            test -f templearchy-aarch64.iso.zst.01
          fi
      - name: Drop leftover drafts and a half-published nightly
        run: |
          gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft==true) | .id' \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/releases/{}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep parts as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: templearchy-aarch64-iso
          path: templearchy-aarch64.iso.zst*
          if-no-files-found: error
      - name: Publish nightly
        run: |
          shopt -s nullglob
          mapfile -t local_parts < <(find . -maxdepth 1 \( -name 'templearchy-aarch64.iso.zst' -o -name 'templearchy-aarch64.iso.zst.[0-9][0-9]' \) -printf '%f\n' | sort)
          test "${#local_parts[@]}" -gt 0
          echo "local parts: ${local_parts[*]}"
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --title "templearchy nightly" --notes "NixOS aarch64 live ISO (i3 + wezterm + nvim). Password is temple."
          else
            gh release edit nightly --title "templearchy nightly" --notes "NixOS aarch64 live ISO (i3 + wezterm + nvim). Password is temple."
          fi
          gh release upload nightly "${local_parts[@]}" --clobber
          remote=""
          for attempt in 1 2 3 4 5 6 7 8; do
            remote="$(gh release view nightly --json assets --jq '.assets[].name')"
            echo "nightly assets (try ${attempt}):"
            echo "$remote"
            missing=0
            for part in "${local_parts[@]}"; do
              echo "$remote" | grep -qx "$part" || missing=1
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          for part in "${local_parts[@]}"; do
            echo "$remote" | grep -qx "$part" || {
              echo "nightly is missing $part" >&2
              exit 1
            }
          done
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            keep=0
            for part in "${local_parts[@]}"; do
              if [ "$name" = "$part" ]; then
                keep=1
              fi
            done
            if [ "$keep" -eq 0 ]; then
              echo "deleting stale nightly asset $name"
              gh release delete-asset nightly "$name" --yes
            fi
          done <<< "$remote"
        env:
          GH_TOKEN: ${{ github.token }}
