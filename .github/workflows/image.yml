name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build live ISO from flake (no KVM)
        run: nix build .#packages.aarch64-linux.iso -L --out-link result
      - name: Compress ISO
        run: |
          iso="$(find -L result -name '*.iso' -print -quit)"
          test -n "$iso"
          zstd -T0 -19 -f "$iso" -o templearchy-aarch64.iso.zst
          ls -lh templearchy-aarch64.iso.zst
      - name: Publish nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: templearchy nightly
          files: templearchy-aarch64.iso.zst
          body: NixOS aarch64 live ISO (i3 + wezterm + nvim). Built from flake.nix without KVM. Password is temple.
          make_latest: true
