set -g default-terminal "tmux-256color"
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-style "bg=#000000,fg=#00ff00"
set -g status-left "#[fg=#00ffff,bg=#000000] TEMPLE #[fg=#00ff00]"
set -g status-right "#[fg=#00ffff]%Y-%m-%d %H:%M "
set -g status-left-length 20
set -g window-status-current-style "bg=#00ffff,fg=#000000"
set -g window-status-style "bg=#000000,fg=#00a600"
set -g pane-border-style "fg=#00a6b2"
set -g pane-active-border-style "fg=#00ffff"
set -g message-style "bg=#000000,fg=#ffff00"
set -g mode-style "bg=#00ffff,fg=#000000"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 20000
set -s escape-time 0

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# LLM / nvim workstation: nvim left, shell right, queue window
bind N new-window -n nvim "nvim"
bind Q new-window -n queue "q watch"
bind L new-session -A -s temple \; rename-window nvim \; send-keys "nvim" C-m \; split-window -h \; select-pane -t 0
